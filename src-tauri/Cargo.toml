[package]
name = "agent-ide"
version = "0.1.0"
description = "Agent IDE - AI-powered code editor"
authors = ["Agent IDE Team"]
license = "MIT"
edition = "2021"
default-run = "agent-ide"

[lib]
name = "agent_ide_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
portable-pty = "0.8"
uuid = { version = "1", features = ["v4"] }
reqwest = { version = "0.12", features = ["stream", "json"] }
futures-util = "0.3"
similar = "2"
chrono = { version = "0.4", features = ["serde"] }
notify = "6"
walkdir = "2"
git2 = "0.19"
dirs-next = "2"
# keyring v3 必须显式启用平台后端；不指定 feature 时编译进去的是 mock store，
# 它对写入返回 Ok、对读取返回 NoEntry —— 也就是所有密钥静默丢弃。
# Linux 用 sync-secret-service 而不是 linux-native：后者基于 keyutils，进程退出即丢。
keyring = { version = "3", features = [
    "apple-native",
    "windows-native",
    "sync-secret-service",
] }
async-trait = "0.1"

# 性能监控依赖
flamegraph = { version = "0.6", optional = true }
criterion = { version = "0.5", features = ["html_reports"], optional = true }

# 本地模型走 OpenAI 兼容的 HTTP 端点（Ollama / LM Studio / vLLM），不再进程内
# 链接推理引擎。llama_cpp_rs 需要 LLVM/libclang 和一次完整的 llama.cpp 原生构建，
# 这个代价换来的是一条从未上线过的代码路径，同时让默认 `cargo build` 在没装
# libclang 的机器上直接失败。
[features]
performance-tools = ["flamegraph", "criterion"]

# 桌面观察面（窗口枚举）只需要几个 Win32 调用，所以用 `windows-sys` 而不是 `windows`：
# 后者会把整套 COM/WinRT 投影和一次可观的编译时间带进来，而这里要的是三个函数。
# 版本钉死：这层是 unsafe FFI，签名变化必须由人看过再升。
#
# 这张表放在文件末尾：TOML 的表头会终止上一张表，插在 `[dependencies]` 中间会把它
# 后面的条目一起变成 windows-only —— 上一版就是这样把 flamegraph / criterion 划到了
# `cfg(windows)` 下面，而且 Cargo 不报错、非 Windows 上 `--features performance-tools`
# 静默什么都不启用。
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.59.0", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Threading",
] }
