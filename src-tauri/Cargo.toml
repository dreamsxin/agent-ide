[package]
name = "agent-ide"
version = "0.1.0"
description = "Agent IDE - AI-powered code editor"
authors = ["Agent IDE Team"]
license = "MIT"
edition = "2021"
default-run = "agent-ide"

[lib]
name = "agent_ide_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
portable-pty = "0.8"
uuid = { version = "1", features = ["v4"] }
reqwest = { version = "0.12", features = ["stream", "json"] }
futures-util = "0.3"
similar = "2"
chrono = { version = "0.4", features = ["serde"] }
notify = "6"
walkdir = "2"
git2 = "0.19"
dirs-next = "2"
# keyring v3 必须显式启用平台后端；不指定 feature 时编译进去的是 mock store，
# 它对写入返回 Ok、对读取返回 NoEntry —— 也就是所有密钥静默丢弃。
# Linux 用 sync-secret-service 而不是 linux-native：后者基于 keyutils，进程退出即丢。
keyring = { version = "3", features = [
    "apple-native",
    "windows-native",
    "sync-secret-service",
] }
async-trait = "0.1"

# 本地推理引擎依赖
llama-cpp-rs = { package = "llama_cpp_rs", version = "0.3", optional = true }
candle-core = { version = "0.7", features = ["cuda"], optional = true }
candle-transformers = { version = "0.7", optional = true }
candle-nn = { version = "0.7", optional = true }
tokenizers = { version = "0.20", optional = true }
hf-hub = { version = "0.3", optional = true }
ureq = { version = "2.9", optional = true }

# 性能监控依赖
flamegraph = { version = "0.6", optional = true }
criterion = { version = "0.5", features = ["html_reports"], optional = true }

[features]
default = ["llama-cpp"]
llama-cpp = ["llama-cpp-rs", "tokenizers", "hf-hub", "ureq"]
candle = ["candle-core", "candle-transformers", "candle-nn", "tokenizers", "hf-hub", "ureq"]
performance-tools = ["flamegraph", "criterion"]
