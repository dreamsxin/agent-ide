name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (typecheck + build + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # `npm run build` runs `tsc` first, so this gates types and the bundle.
      - name: Typecheck and build
        run: npm run build

      - name: Unit tests
        run: npm test

  rust:
    name: Rust (fmt + clippy + tests)
    # Windows is the primary supported platform. Linux/macOS jobs are added
    # once the Phase 10 cross-platform packaging work lands.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Formatting
        working-directory: src-tauri
        run: cargo fmt --check

      # The default `llama-cpp` feature needs LLVM/libclang plus a full
      # llama.cpp native build, so CI verifies the feature-off build that every
      # non-local-inference code path uses.
      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --no-default-features --all-targets -- -D warnings

      - name: Tests
        working-directory: src-tauri
        run: cargo test --no-default-features
