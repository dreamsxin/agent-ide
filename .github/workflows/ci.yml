name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (typecheck + build + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # `npm run build` runs `tsc` first, so this gates types and the bundle.
      - name: Typecheck and build
        run: npm run build

      - name: Unit tests
        run: npm test

  rust:
    name: Rust (fmt + clippy + tests)
    # Windows is the primary supported platform and the only one whose
    # credential backend has been verified by hand. The Linux job below is the
    # first step toward the Phase 10.4 cross-platform work.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Formatting
        working-directory: src-tauri
        run: cargo fmt --check

      # No feature flags: in-process local inference is gone, so what CI builds
      # is exactly what `cargo build` gives a contributor.
      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests
        working-directory: src-tauri
        run: cargo test


  rust-linux:
    name: Rust on Linux (clippy + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: linux

      # Tauri v2 links against the system webview and GTK stack; without these
      # the crate does not even compile on Linux.
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            patchelf

      # The credential round-trip test talks to a real OS credential store.
      # On Linux that is Secret Service, which needs a session bus and a
      # running keyring daemon — otherwise `keyring` reports "no entry" for
      # everything, which is exactly the silent-discard failure mode that made
      # every saved API key vanish before the backend features were pinned.
      # Installing these is what turns "Linux backend unvalidated" into a
      # verified claim rather than a footnote in SECURITY.md.
      - name: Install Secret Service for the credential test
        run: sudo apt-get install --no-install-recommends -y gnome-keyring dbus-x11

      # `cargo fmt --check` is platform independent and already runs in the
      # Windows job, so it is not repeated here. Clippy is: it compiles the
      # `cfg(unix)` paths that the Windows job never sees.
      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests
        working-directory: src-tauri
        run: |
          dbus-run-session -- bash -c '
            echo "" | gnome-keyring-daemon --unlock --components=secrets
            cargo test
          '

  rust-macos:
    name: Rust on macOS (clippy + tests)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: macos

      # macOS needs no extra system packages: WebKit and Security.framework
      # ship with the OS, unlike the GTK/webkit2gtk stack on Linux.
      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      # The credential round-trip test uses the Keychain via the `apple-native`
      # backend. GitHub's macOS runners normally have an unlocked login
      # keychain, so no setup is attempted here — if that assumption is wrong
      # this step is where it will show, which is the point of adding the job.
      - name: Tests
        working-directory: src-tauri
        run: cargo test


